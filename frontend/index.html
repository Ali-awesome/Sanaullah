    <!-- Sets the very first paint to black, before the app's own JS/CSS
         bundle has even loaded — LoadingSpinner and Preloader both render
         on black, but without this the browser's default white background
         shows through for a frame first (most noticeable on slower mobile
         connections, where that gap is longer), which reads as a jarring
         white flash right before the black loading screen. -->
    <style>
      html,
      body {
        background: #000;
      }
    </style>

    <!-- Applies a saved theme choice to <html> before the app's own JS
         bundle loads and before first paint, so a returning visitor who
         chose dark never sees a flash of the light theme first. See
         ThemeToggle.jsx, which reads/writes the same localStorage key and
         `data-theme` attribute after mount. Defaults to light (no
         attribute) for a first-time visitor — matches the toggle's own
         default, see that file for why it doesn't follow system
         preference. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("portfolio_theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>

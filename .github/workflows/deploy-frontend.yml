name: Deploy frontend to GitHub Pages

# Frontend-only hosting: GitHub Pages serves static files, so this builds
# and publishes frontend/dist. There is no backend here — set the
# VITE_API_BASE_URL repository variable (Settings → Secrets and variables →
# Actions → Variables) to a backend deployed elsewhere (e.g. Vercel
# Functions; see the README) for the contact form / admin panel / posts to
# work. Without it, the site renders but API calls will fail.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # "/<repo-name>/" — required for a GitHub Pages *project* site
          # (username.github.io/<repo-name>/). Omit this line entirely if
          # deploying to a *user/org* site (username.github.io) served
          # from the root.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
